name: Upstream Sync and Cockpit Release

on:
  push:
    branches: [master]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamvault-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: Davidona/StreamVault-IPTV
      UPSTREAM_REF: master
      TARGET_BRANCH: master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Configure and fetch repositories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch origin "$TARGET_BRANCH"
          git fetch upstream "$UPSTREAM_REF"

      - name: Rebuild upstream and overlay Cockpit modifications
        id: overlay
        shell: bash
        run: |
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          old_head="$(git rev-parse HEAD)"
          old_base="$(git merge-base HEAD "upstream/$UPSTREAM_REF")"
          new_upstream="$(git rev-parse "upstream/$UPSTREAM_REF")"
          if [ "$old_base" = "$new_upstream" ]; then
            if [ "${{ github.event_name }}" != "schedule" ]; then
              echo "old_head=$old_head" >> "$GITHUB_OUTPUT"
              echo "manual_build=true" >> "$GITHUB_OUTPUT"
              echo "Manual run requested: building and releasing the current verified Cockpit tree." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "no_changes=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          patch="$RUNNER_TEMP/cockpit-overlay.patch"
          git diff --binary "$old_base..$old_head" > "$patch"
          test -s "$patch"
          git reset --hard "upstream/$UPSTREAM_REF"
          if ! git apply --3way --index "$patch"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if (( ${#conflicts[@]} == 0 )); then
              echo "Cockpit overlay failed without resolvable index conflicts." >&2
              exit 1
            fi
            # Prefer the Cockpit overlay for conflicted files. Marker checks and the
            # full compile/build below prevent a broken automatic sync being pushed.
            git checkout --theirs -- "${conflicts[@]}"
            git add -- "${conflicts[@]}"
          fi
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'
          git commit -m "chore: sync upstream and reapply Cockpit overlay"
          echo "old_head=$old_head" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.overlay.outputs.no_changes != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        if: steps.overlay.outputs.no_changes != 'true'
        uses: android-actions/setup-android@v3

      - name: Prepare optional signing
        if: steps.overlay.outputs.no_changes != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            printf '%s\n' 'storeFile=keystore/release.jks' "storePassword=$RELEASE_STORE_PASSWORD" "keyAlias=$RELEASE_KEY_ALIAS" "keyPassword=$RELEASE_KEY_PASSWORD" > keystore.properties
          fi

      - name: Verify Cockpit overlay
        if: steps.overlay.outputs.no_changes != 'true'
        run: |
          grep -q 'demo.cockpit.lol/api/streamvault' app/src/main/java/com/PanelURL.kt
          grep -q 'PanelURL.URL + "api.php"' app/src/main/java/com/streamvault/app/ui/screens/provider/ProviderSetupViewModel.kt
          grep -q 'PanelURL.URL + "update.php"' app/src/main/java/com/streamvault/app/update/GitHubReleaseChecker.kt
          grep -q 'portalId' app/src/main/java/com/streamvault/app/pairing/ProviderQrPairingManager.kt
          grep -q 'receivedPage()' app/src/main/java/com/streamvault/app/pairing/ProviderQrPairingManager.kt
          grep -q 'PortalSelector(' app/src/main/java/com/streamvault/app/ui/screens/provider/ProviderSetupScreen.kt
          grep -q 'isEditing && sourceType == SourceType.M3U_URL' app/src/main/java/com/streamvault/app/ui/screens/provider/ProviderSetupScreen.kt
          grep -q 'isEditing && sourceType == SourceType.JELLYFIN' app/src/main/java/com/streamvault/app/ui/screens/provider/ProviderSetupScreen.kt
          if grep -q 'settingsDriveBackupSection(' app/src/main/java/com/streamvault/app/ui/screens/settings/SettingsContentPane.kt; then
            echo "Google Drive settings UI unexpectedly exposed." >&2
            exit 1
          fi

      - name: Build release APK
        if: steps.overlay.outputs.no_changes != 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

      - name: Collect APK
        if: steps.overlay.outputs.no_changes != 'true'
        id: release
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$version" && test -n "$apk"
          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/StreamVault-$version-$short_sha.apk"
          sha256sum release-artifacts/*.apk > release-artifacts/SHA256SUMS.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=cockpit-v$version-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK
        if: steps.overlay.outputs.no_changes != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-${{ steps.release.outputs.version }}-${{ steps.release.outputs.short_sha }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Push verified sync
        if: steps.overlay.outputs.no_changes != 'true' && steps.overlay.outputs.manual_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_RELEASE_TOKEN || github.token }}
        run: |
          test -n "$GH_TOKEN"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force-with-lease="refs/heads/$TARGET_BRANCH:${{ steps.overlay.outputs.old_head }}" origin "HEAD:$TARGET_BRANCH"

      - name: Publish GitHub release
        if: steps.overlay.outputs.no_changes != 'true'
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_RELEASE_TOKEN || github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" release-artifacts/* --target "${{ steps.release.outputs.sha }}" --title "StreamVault ${{ steps.release.outputs.version }} Cockpit" --generate-notes --latest
