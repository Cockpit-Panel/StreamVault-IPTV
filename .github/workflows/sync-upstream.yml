name: Sync Upstream and Release

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/Davidona/StreamVault-IPTV.git
          git fetch upstream master

      - name: Check for updates and merge
        id: merge_check
        run: |
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/master)
          echo "Upstream is ahead by $BEHIND_COUNT commits"
          
          if [ "$BEHIND_COUNT" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
            if [ "$BEHIND_COUNT" -gt 0 ]; then
              echo "Merging upstream changes..."
              git merge upstream/master -m "Merge upstream changes automatically" --no-edit
              git push origin master
            fi
          else
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read app version
        if: steps.merge_check.outputs.updates_found == 'true'
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read app version from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=StreamVault-$VERSION_NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.merge_check.outputs.updates_found == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        if: steps.merge_check.outputs.updates_found == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional signing files
        if: steps.merge_check.outputs.updates_found == 'true'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            printf '%s\n' \
              'storeFile=keystore/release.jks' \
              "storePassword=$RELEASE_STORE_PASSWORD" \
              "keyAlias=$RELEASE_KEY_ALIAS" \
              "keyPassword=$RELEASE_KEY_PASSWORD" \
              > keystore.properties
          fi

      - name: Grant execute permission for gradlew
        if: steps.merge_check.outputs.updates_found == 'true'
        run: chmod +x gradlew

      - name: Run unit tests and coverage
        if: steps.merge_check.outputs.updates_found == 'true'
        run: ./gradlew --console=plain testDebugUnitTest koverXmlReportCi koverHtmlReportCi

      - name: Build release APK
        if: steps.merge_check.outputs.updates_found == 'true'
        run: ./gradlew --console=plain :app:assembleRelease

      - name: Prepare release artifact
        if: steps.merge_check.outputs.updates_found == 'true'
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK produced."
            exit 1
          fi
          cp "$APK_PATH" "dist/${{ steps.app_version.outputs.apk_name }}"
          cp "$APK_PATH" dist/StreamVault.apk

      - name: Extract changelog entry
        if: steps.merge_check.outputs.updates_found == 'true'
        id: changelog
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version_name }}"
          echo "Extracting notes for version $VERSION"
          {
            echo "notes<<EOF"
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") || $0 ~ ("^## " ver " ") { p=1; next }
              $0 ~ "^## " && p { p=0 }
              p { print }
            ' docs/CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.merge_check.outputs.updates_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.release_tag }}
          name: StreamVault ${{ steps.app_version.outputs.version_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}
            
            ---
            Automatically synced with upstream and built from `${{ github.sha }}`.
          files: |
            dist/${{ steps.app_version.outputs.apk_name }}
            dist/StreamVault.apk
          make_latest: true
          generate_release_notes: false
